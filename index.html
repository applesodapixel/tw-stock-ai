<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6f4">
<link rel="manifest" href="manifest.webmanifest">
<title>台股 AI 盤後情報</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#1d2824;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}button{font:inherit}.app{max-width:760px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:19px;font-weight:850}.sub{font-size:12px;color:#75817d}.refresh{border:0;background:#dfece6;color:#17664f;border-radius:999px;padding:9px 12px;font-weight:750}.refresh.busy{opacity:.55}.card{background:#fff;border:1px solid #dfe7e3;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(24,48,40,.025)}h1,h2,h3,p{margin-top:0}h1{font-size:25px}h2{font-size:18px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:12px;padding:5px 9px;border-radius:999px;background:#eef4f1}.big{font-size:32px;font-weight:850}.label,.note{font-size:12px;color:#75817d}.note{line-height:1.55}.up{color:#d94f4f}.down{color:#168b66}.neutral{color:#727c78}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:#f6f8f7;border-radius:14px;padding:12px;min-height:72px}.box b{display:block;font-size:18px;margin-top:5px}.live{background:#f7fbf9;border:1px solid #dbece4;border-radius:16px;padding:12px;margin-top:10px}.headline{padding:11px 0;border-bottom:1px solid #edf1ef;font-size:14px;line-height:1.45}.headline:last-child{border:0}.headline a{color:inherit;text-decoration:none}.source{font-size:11px;color:#7b8581;margin-top:4px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;border:1px solid #d8e1dd;background:#f7faf8;border-radius:999px;padding:8px 11px;font-size:13px}.tab.on{background:#dfece6;font-weight:750}.sector{padding:14px 0;border-bottom:1px solid #edf0ee;cursor:pointer}.sector:last-child{border:0}.sector b{font-size:16px}.mini{font-size:12px;color:#73807b;margin-top:5px;line-height:1.5}.stock{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid #edf0ee}.stock:last-child{border:0}.score{font-size:20px;font-weight:850;text-align:right}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dce4e0;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));z-index:10}.nav{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.nav button{border:0;background:none;padding:8px 4px;color:#64706c;font-size:12px}.nav button.on{color:#087f5b;font-weight:850}.page.hidden{display:none}.sheet{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.sheet.on{display:flex}.panel{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:25px 25px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.close{float:right;border:0;background:#eef2f0;border-radius:50%;width:35px;height:35px;font-size:20px}.status{font-size:12px;background:#f5f8f6;border-radius:12px;padding:9px 10px;line-height:1.5;margin-top:10px}.empty{text-align:center;color:#77827e;padding:24px}.search{width:100%;border:1px solid #dbe3df;border-radius:13px;padding:10px 12px;background:#fafcfb;font-size:14px}.marketchips{display:flex;gap:7px;overflow:auto;margin-top:9px}.chip{white-space:nowrap;background:#f3f6f4;border-radius:12px;padding:8px 10px;font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><div class="brand">台股 AI 盤後情報</div><div class="sub" id="timeText">讀取中</div></div><button id="refreshBtn" class="refresh" onclick="boot(true)">更新資料</button></div>

  <section id="today" class="page">
    <div class="card">
      <div class="row"><div><h1>今日市場</h1><span class="label">收盤正式資料</span></div><span id="marketRet" class="tag">—</span></div>
      <div class="status" id="dataStatus">正在讀取最新資料。</div>
    </div>

    <div class="card">
      <div class="row"><h2>明日正式預測</h2><span class="label">事前登記，不會被夜間新聞覆寫</span></div>
      <div class="grid">
        <div class="box"><span class="label">方向</span><b id="direction">—</b></div>
        <div class="box"><span class="label">信心</span><b id="confidence">—</b></div>
        <div class="box"><span class="label">預估區間</span><b id="range">—</b></div>
        <div class="box"><span class="label">模型世代</span><b id="generation">—</b></div>
      </div>
      <p id="forecastWhy" class="note" style="margin-top:11px">資料累積中。</p>
    </div>

    <div class="card">
      <div class="row"><h2>美國夜間即時修正</h2><span id="nightBias" class="tag">—</span></div>
      <p class="note">晚上美股、Fed、NVIDIA、台積電 ADR、關稅等新消息會另外更新；不回頭改寫正式預測。</p>
      <div class="marketchips" id="usMarkets"></div>
      <div class="live"><div class="row"><b>最新夜間消息</b><span class="label" id="nightTime">—</span></div><div id="headlines"><div class="empty">等待夜間資料</div></div></div>
    </div>

    <div class="card">
      <div class="row"><h2>全市場板塊</h2><span class="label" id="sectorCount">—</span></div>
      <input id="sectorSearch" class="search" placeholder="搜尋中文板塊，例如：半導體、航運、金融" oninput="renderSectors()">
      <div class="tabs" style="margin-top:10px"><button class="tab on" data-mode="buy" onclick="setMode('buy',this)">法人買超</button><button class="tab" data-mode="sell" onclick="setMode('sell',this)">法人賣超</button><button class="tab" data-mode="five" onclick="setMode('five',this)">5 日</button><button class="tab" data-mode="name" onclick="setMode('name',this)">中文排序</button></div>
      <div id="sectors"></div>
    </div>

    <div class="card"><h2>昨日預測驗證</h2><div id="verify" class="note">尚無可驗證資料。</div></div>
    <div class="card"><h2>AI 盤後總結</h2><div id="summary" class="note">資料累積中。</div></div>
  </section>

  <section id="rank" class="page hidden"><div class="card"><h1>個股排行</h1><p class="note">此頁顯示目前 AI 分數較高的股票；完整成分股請從板塊點入。</p><div id="stocks"></div></div></section>
  <section id="history" class="page hidden"><div class="card"><h1>預測戰績</h1><div id="historyBody" class="note">讀取中。</div></div></section>
</main>
<div class="bottom"><div class="nav"><button class="on" onclick="go('today',this)">今日</button><button onclick="go('rank',this)">排行</button><button onclick="go('history',this)">驗證</button></div></div>
<div class="sheet" id="sheet"><div class="panel"><button class="close" onclick="sheet.classList.remove('on')">×</button><div id="detail"></div></div></div>
<script>
const $=q=>document.querySelector(q);let latest={},sectors=[],predictions=[],mode='buy';
const num=x=>x==null||isNaN(+x)?null:+x;const fmt=x=>num(x)==null?'—':(+x).toFixed(2);const cls=x=>num(x)>0?'up':num(x)<0?'down':'neutral';
function go(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
async function jget(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);return r.json()}
function ageText(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return s;const m=Math.max(0,Math.round((Date.now()-d.getTime())/60000));if(m<2)return '剛剛';if(m<60)return `${m} 分鐘前`;return `${Math.floor(m/60)} 小時前`}
async function boot(manual=false){const b=$('#refreshBtn');b.classList.add('busy');b.textContent='更新中…';try{const [l,ss,pp,oo]=await Promise.all([jget('data/latest.json'),jget('data/sectors.json'),jget('data/predictions.json'),jget('data/overnight.json').catch(()=>({}))]);latest=l||{};sectors=(ss&&ss.sectors)||[];predictions=(pp&&pp.predictions)||[];render(oo||{});if(manual)$('#dataStatus').innerHTML='已重新向伺服器抓取最新資料。夜間來源由排程每小時更新，這裡不使用瀏覽器快取。';}catch(e){$('#dataStatus').textContent='更新失敗：'+e.message;}finally{b.classList.remove('busy');b.textContent='更新資料'}}
function render(o){$('#timeText').textContent=`台股資料 ${latest.market_date||'—'}｜伺服器更新 ${ageText(latest.updated_at)}`;const r=num(latest.market_return);$('#marketRet').textContent=r==null?'大盤 —':`大盤 ${r>0?'+':''}${r.toFixed(2)}%`;$('#marketRet').className='tag '+cls(r);const f=latest.forecast||{};$('#direction').textContent=f.direction||'—';$('#confidence').textContent=f.confidence==null?'—':f.confidence+'%';$('#range').textContent=f.range||'—';$('#generation').textContent=f.model_generation==null?'—':'G'+f.model_generation;$('#forecastWhy').textContent=f.reason||'資料累積中。';$('#summary').textContent=latest.summary||'—';$('#verify').innerHTML=(latest.verification&&latest.verification.html)||'尚無可驗證資料。';$('#sectorCount').textContent=`${sectors.length} 個中文板塊`;renderSectors();renderStocks();renderHistory();renderOvernight(o)}
function setMode(m,b){mode=m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderSectors()}
function val(s){if(mode==='five')return num(s.net5_value)||0;return num(s.net_buy_value)||0}
function renderSectors(){const q=($('#sectorSearch').value||'').trim();let a=sectors.filter(s=>!q||String(s.name).includes(q));if(mode==='buy')a.sort((x,y)=>val(y)-val(x));else if(mode==='sell')a.sort((x,y)=>val(x)-val(y));else if(mode==='five')a.sort((x,y)=>val(y)-val(x));else a.sort((x,y)=>String(x.name).localeCompare(String(y.name),'zh-Hant'));$('#sectors').innerHTML=a.length?a.map((s,i)=>`<div class="sector" onclick="openSector('${encodeURIComponent(s.name)}')"><div class="row"><b>${s.name}</b><span class="${cls(mode==='five'?s.net5_value:s.net_buy_value)}">${mode==='five'?(s.net5_text||'—'):(s.net_buy_text||'—')}</span></div><div class="mini">${s.note||''}</div></div>`).join(''):'<div class="empty">找不到板塊</div>'}
function openSector(enc){const name=decodeURIComponent(enc);const s=sectors.find(x=>x.name===name);if(!s)return;const arr=s.stocks||[];$('#detail').innerHTML=`<h2>${s.name}</h2><p class="note">${s.note||''}<br>當日法人 ${s.net_buy_text||'—'}｜5 日 ${s.net5_text||'—'}｜20 日 ${s.net20_text||'—'}</p>${arr.map(x=>stockRow(x)).join('')||'<div class="empty">暫無成分股</div>'}`;$('#sheet').classList.add('on')}
function stockRow(x){return `<div class="stock"><div><b>${x.code} ${x.name}</b><div class="mini">${x.market||''}｜${x.industry||''}｜法人 ${x.insti_yi==null?'—':(x.insti_yi>0?'+':'')+fmt(x.insti_yi)+' 億'}</div></div><div><div class="score">${x.score==null?'—':x.score}</div><div class="${cls(x.ret1)}">${x.ret1==null?'—':(x.ret1>0?'+':'')+fmt(x.ret1)+'%'}</div></div></div>`}
function renderStocks(){const a=(latest.stocks||[]).slice(0,80);$('#stocks').innerHTML=a.length?a.map(stockRow).join(''):'<div class="empty">等待個股資料</div>'}
function renderHistory(){const v=predictions.filter(x=>x.verified).slice(-30).reverse();$('#historyBody').innerHTML=v.length?v.map(x=>`<div class="headline"><b>${x.prediction_for}｜${x.correct?'✅ 命中':'❌ 未命中'}</b><div class="mini">預測 ${x.direction}｜實際 ${x.actual_direction} ${x.actual_return>0?'+':''}${fmt(x.actual_return)}%<br>${x.error_reason||''}</div></div>`).join(''):'尚未累積可驗證的正式事前預測。'}
function renderOvernight(o){$('#nightBias').textContent=o.bias?`${o.bias} ${o.confidence||''}${o.confidence?'%':''}`:'尚未更新';$('#nightBias').className='tag '+(o.bias==='偏多'?'up':o.bias==='偏空'?'down':'neutral');$('#nightTime').textContent=o.updated_at?ageText(o.updated_at):'—';const ms=o.markets||[];$('#usMarkets').innerHTML=ms.map(x=>`<div class="chip">${x.label} <span class="${cls(x.change_pct)}">${x.change_pct==null?'—':(x.change_pct>0?'+':'')+fmt(x.change_pct)+'%'}</span></div>`).join('');const hs=o.headlines||[];$('#headlines').innerHTML=hs.length?hs.slice(0,8).map(x=>`<div class="headline"><a href="${x.link||'#'}" target="_blank" rel="noopener">${x.title}</a><div class="source">${x.source||'公開新聞'} ${x.published||''}</div></div>`).join(''):'<div class="empty">目前沒有新的夜間消息</div>'}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
boot();
</script>
</body></html>
