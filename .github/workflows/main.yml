name: 台股 AI 每日自動更新

on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新台股資料與 AI 預測
        run: python update.py

      - name: 寫回最新資料
        run: |
          git config user.name "tw-stock-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: daily auto update"
            git push
          fi
